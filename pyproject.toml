[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallcaged"
version = "0.1.0"
description = "Guitar chord shape filter from Howard's Big List"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["smallcaged*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
